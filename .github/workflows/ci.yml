name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege by default. The one job that needs to write a package raises it itself.
permissions:
  contents: read

# Pushing twice in quick succession leaves the first run building an image nobody will use.
# Grouped per ref, so main and each PR cancel only their own superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # Keyed on the project files, since those determine the package set. A miss only
      # costs a slower restore - it can never fail the run - so there is no lock file to
      # keep in sync, which would be one more thing to break on a Dependabot bump.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # --no-restore and --no-build make each step fail on its own terms: a restore problem
      # cannot masquerade as a build failure, and the test step cannot quietly rebuild and
      # hide a compile error that the build step should have reported.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # No `services:` block for Postgres. The integration tests start their own container
      # through Testcontainers, and ubuntu-latest runners already have Docker running - a
      # service container here would sit idle while the tests talked to a different one.
      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "GitHubActions;summary.includePassedTests=false"
          --results-directory ${{ github.workspace }}/TestResults

      # always(), because a failed run is exactly when someone needs to read these.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx
          if-no-files-found: error

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    # No point building an image from code that failed its tests, and gating this way keeps
    # a red test run from producing an artifact that looks releasable.
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests. A PR from a fork must never be able to authenticate as
      # this repository and publish under its name.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # metadata-action rather than a hand-written tags: list, and not only for convenience.
      # GHCR rejects mixed-case names, and this repository's owner is julianNordin - a raw
      # ghcr.io/${{ github.repository }} would be refused. metadata-action lowercases it.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pushes on a push to main; a pull_request run builds and throws the image away.
          # Pull requests are untrusted input, and there is no reason a proposal should be
          # able to overwrite a published tag.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every run starts from an empty layer cache and re-runs the NuGet
          # restore inside the image. mode=max keeps the intermediate build-stage layers as
          # well as the final ones, which is where the restore actually lives.
          cache-from: type=gha
          cache-to: type=gha,mode=max
