name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Keyed on the project files, since those determine the package set. A miss only
      # costs a slower restore - it can never fail the run - so there is no lock file to
      # keep in sync, which would be one more thing to break on a Dependabot bump.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # --no-restore and --no-build make each step fail on its own terms: a restore problem
      # cannot masquerade as a build failure, and the test step cannot quietly rebuild and
      # hide a compile error that the build step should have reported.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
