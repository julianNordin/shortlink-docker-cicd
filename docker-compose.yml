# The whole stack: `docker compose up` builds the API image, starts PostgreSQL, waits for it
# to be healthy, and runs the API against it. No .NET SDK needed on the host.
services:
  db:
    image: postgres:16-alpine
    container_name: shortlink-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortlink}
      POSTGRES_DB: ${POSTGRES_DB:-shortlink}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # `$$` so Compose leaves the variable alone and the container's own shell expands it.
      # `-d` makes this probe the database rather than only the socket: on first boot the
      # entrypoint starts a temporary server to run initdb, and a socket-only check goes
      # green against that one before the real database exists.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # initdb on a cold volume takes a few seconds; failures before this elapses don't count.
      start_period: 10s
    volumes:
      # Named volume, not a bind mount: Postgres needs Linux file permissions that a
      # Windows host directory can't provide.
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
    container_name: shortlink-api
    environment:
      # Host is the service name, resolved on the Compose network - not localhost, which
      # inside this container would mean the API container itself. The port is always 5432
      # here; POSTGRES_PORT only remaps the host side.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-shortlink};Username=${POSTGRES_USER:-shortlink};Password=${POSTGRES_PASSWORD:-shortlink}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        # Not just `depends_on: [db]`, which waits for the container to start rather than for
        # Postgres to accept connections. The API applies migrations at startup, so starting a
        # few seconds early means it throws instead of waiting.
        condition: service_healthy

volumes:
  pgdata:
